
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Jag Singh</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://jagmsingh.com/style.css">
    <style>
        ul {
            columns: 3;
            list-style-type: none;
        }
    </style>
</head>

<body>
    <header>
        <h3>Plane Spotter: All Days</h3>
        <p>by Jag Singh</p>
    </header>
    <nav>
        <a href="https://jagmsingh.com">Home</a> : <a
            href="https://jagmsingh.com/Plane Spotter/Plane Spotter.html">About Plane Spotter</a> : All Days
    </nav>
    <main>
        <p>

        <ul id="planes-list"></ul>
        <script>
            fetch('https://storage.googleapis.com/storage/v1/b/planes.jagmsingh.com/o?prefix=planes_') // only list file names starting with 'planes_'
                .then(response => response.json())
                .then(data => {
                    const files = data.items || [];
                    const htmlFiles = files
                        .map(item => item.name)
                        .filter(name => name.endsWith('.html')) // Filter to include only HTML files
                        .sort((a, b) => b.localeCompare(a)); // Sort in descending order
                    const list = document.getElementById('planes-list');
                    htmlFiles.forEach(name => {
                        const li = document.createElement('li');
                        const a = document.createElement('a');
                        const dateStr = name.replace('planes_', '').replace('.html', '');
                        // Convert from YYMMDD to Mon DD, YYYY for display
                        const year = '20' + dateStr.slice(0, 2);
                        const month = dateStr.slice(2, 4);
                        const day = dateStr.slice(4, 6);
                        const dateObj = new Date(year, month - 1, day);
                        const options = { year: 'numeric', month: 'short', day: '2-digit' };
                        const formattedDate = dateObj.toLocaleDateString('en-US', options);
                        a.href = `http://planes.jagmsingh.com/${name}`;
                        a.textContent = formattedDate; li.appendChild(a);
                        list.appendChild(li);
                    });
                })
                .catch(error => {
                    document.getElementById('planes-list').innerHTML = '<li>Error loading file list.</li>';
                });
        </script>
        </p>

    </main>
    <footer>
        <p>&copy; <a href="mailto:jag.m.singh@gmail.com">jag.m.singh@gmail.com</a></p>
    </footer>
</body>

</html>
