name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  # GHCR requires a lowercase path. github.repository_owner is "JagSingh",
  # so it cannot be used directly — this must match the image: line in
  # docker-compose.yml or the deploy pulls a different tag than we push.
  IMAGE: ghcr.io/jagsingh/plane_spotter

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # conftest.py stubs cv2, ultralytics and google-cloud-storage, so CI
      # needs only the dev tools plus the two libraries actually exercised:
      # requests (create_document) and PyYAML (get_config). Torch is never
      # downloaded. -c applies the pins from requirements.txt without
      # installing everything in it, so CI and the laptop agree on versions.
      - name: Install test dependencies
        run: pip install -r requirements-dev.txt requests PyYAML -c requirements.txt

      - name: Lint
        run: ruff check .

      - name: Run tests
        run: pytest tests/ -v

  build-and-push:
    needs: lint-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Self-hosted runner on the spotter laptop (SDR + camera attached).
    # Until a runner is registered and online this job sits queued; the
    # build above still publishes the image.
    runs-on: [self-hosted, plane-spotter]
    steps:
      - uses: actions/checkout@v4

      - name: Pull latest image and restart
        run: |
          docker compose pull
          docker compose up -d
          docker image prune -f

      - name: Show container state
        run: docker compose ps
